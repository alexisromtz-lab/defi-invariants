name: capsulas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capsulas:
    # Anclado, no `ubuntu-latest`: la etiqueta migra a Ubuntu 26 y una compuerta no
    # debe cambiar de suelo sin que alguien lo decida.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Misma version que se uso para escribir las capsulas (forge 1.9.0, 6056c584).
      # El solc no se fija a proposito: asi el CI mide lo que mide un clon cualquiera.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: ejecutor
        run: forge --version

      - name: cada capsula roja en el ataque y verde en el parche
        run: ./verificar-capsulas.sh
